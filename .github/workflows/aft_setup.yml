---
name: INFRASTRUCTURE SETUP FROM AFT ACCOUNT
run-name: '[${{ github.event_name }} - ${{ github.ref_name }}] by @${{ github.actor }}'

on:
  push:
    branches:
      - main

permissions:
    id-token: write
    contents: read
    pull-requests: write

env:
    terraformS3Key: ${{ secrets.MANAGEMENT_ACCOUNT }}/${{ github.repository }}/${{ github.ref_name}}.tfstate
    terraformModulesGithubOrg: ${{ github.repository_owner}}
    terraformS3Acl: bucket-owner-full-control
    oidcRoleName: fynex-github-oidc-role
    terraformBucket: fynex-tf-state
    terraformDynamo: fynex-tf-state
    terraformS3Encryption: true
    terraformVersion: 1.9.5
    awsRegion: us-east-1

    # .tfvars Terraform Variables
    TF_VAR_aft_management_account_id: ${{ secrets.AFT_ACCOUNT }}
    TF_VAR_ct_management_account_id: ${{ secrets.MANAGEMENT_ACCOUNT }}
    TF_VAR_log_archive_account_id: ${{ secrets.LOGARCHIVE_ACCOUNT }}
    TF_VAR_audit_account_id: ${{ secrets.AUDIT_ACCOUNT }}

jobs:
    CT_AFT_SETUP:
        name: Control Tower AFT Setup
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: ${{ env.terraformVersion }}
                terraform_wrapper: false

            - name: Debug OIDC identity
              run: |
                echo "Repo: ${{ github.repository }}"
                echo "Owner: ${{ github.repository_owner }}"
                echo "Ref: ${{ github.ref }}"
                echo "Event: ${{ github.event_name }}"
                echo "Target AWS account: ${{ secrets.MANAGEMENT_ACCOUNT }}"
                IDTOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
                echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, repository_owner}'

            - name: configure aws credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: arn:aws:iam::${{ secrets.MANAGEMENT_ACCOUNT }}:role/${{ env.oidcRoleName }}
                role-session-name: OIDCSession
                aws-region: ${{ env.awsRegion }}

            - name: Terraform Format
              run: terraform fmt --check

            - name: Terraform Init
              id: init
              run: terraform init -backend-config="bucket=${{ env.terraformBucket }}" -backend-config="dynamodb_table=${{ env.terraformDynamo }}" -backend-config="key=${{ env.terraformS3Key}}" -backend-config="region=${{ env.awsRegion }}" -backend-config="acl=${{ env.terraformS3Acl }}" -backend-config="encrypt=${{ env.terraformS3Encryption }}"

            - name: Terraform Validate
              id: validate
              run: terraform validate

            - name: Terraform Plan
              id: plan
              run: terraform plan --var-file=terraform.tfvars -no-color -out tf.plan

            - name: Terraform Apply
              id: apply
              run: |
                terraform apply --var-file=terraform.tfvars -auto-approve